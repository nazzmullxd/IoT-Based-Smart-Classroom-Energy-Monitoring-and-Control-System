[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-classroom-api"
version = "1.0.0"
description = "Local telemetry and control service for the Smart Classroom prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "paho-mqtt==2.1.0",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
research = ["matplotlib>=3.9,<4", "numpy>=2,<3", "pandas>=2.2,<3"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "../.."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_classroom_api"]
