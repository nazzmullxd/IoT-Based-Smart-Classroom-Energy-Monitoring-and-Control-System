services:
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
  server:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install --no-cache-dir -e apps/server && uvicorn smart_classroom_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      MQTT_HOST: mqtt
      DATABASE_PATH: /data/smart_classroom.db
      DASHBOARD_PATH: /workspace/apps/dashboard
    volumes:
      - ../:/workspace
      - server-data:/data
    ports: ["8000:8000"]
    depends_on: [mqtt]
volumes:
  mqtt-data:
  server-data:
