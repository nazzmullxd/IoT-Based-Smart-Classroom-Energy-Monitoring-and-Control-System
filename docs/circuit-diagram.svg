<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg{fill:#07111f}.panel{fill:#102033;stroke:#36516d;stroke-width:2}.board{fill:#123c54;stroke:#37d6c0;stroke-width:3}.sensor{fill:#182c43;stroke:#7cb8e8;stroke-width:2}.relay{fill:#30233d;stroke:#c58ae8;stroke-width:2}.load{fill:#172c2a;stroke:#66ddb2;stroke-width:2}.title{fill:#edf5ff;font:700 32px 'Segoe UI',sans-serif}.subtitle{fill:#8ea3bb;font:16px 'Segoe UI',sans-serif}.label{fill:#edf5ff;font:700 18px 'Segoe UI',sans-serif}.small{fill:#a9bdd1;font:14px 'Segoe UI',sans-serif}.pin{fill:#07111f;stroke:#91a9bf}.wire-data{fill:none;stroke:#37d6c0;stroke-width:4}.wire-power{fill:none;stroke:#ff6969;stroke-width:3}.wire-ground{fill:none;stroke:#8ea3bb;stroke-width:3}.wire-load{fill:none;stroke:#ffb35c;stroke-width:4}.dot{fill:#37d6c0}.legend{fill:#102033;stroke:#36516d}.arrow{fill:#37d6c0}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="arrow" d="M0,0 L0,6 L9,3 z"/></marker>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="55" y="60">Smart Classroom — ESP32 Circuit Diagram</text>
  <text class="subtitle" x="55" y="90">License-independent wiring view · Wokwi source: apps/firmware/diagram.json</text>

  <!-- Sensors -->
  <rect class="panel" x="45" y="130" rx="18" width="300" height="610"/>
  <text class="label" x="70" y="170">SENSING &amp; INPUT</text>
  <rect class="sensor" x="75" y="205" rx="12" width="235" height="105"/>
  <text class="label" x="95" y="238">DHT22</text><text class="small" x="95" y="265">Temperature + humidity</text><text class="small" x="95" y="288">DATA → GPIO 15</text>
  <rect class="sensor" x="75" y="345" rx="12" width="235" height="105"/>
  <text class="label" x="95" y="378">PIR MOTION</text><text class="small" x="95" y="405">Occupancy detection</text><text class="small" x="95" y="428">OUT → GPIO 13</text>
  <rect class="sensor" x="75" y="485" rx="12" width="235" height="105"/>
  <text class="label" x="95" y="518">PHOTORESISTOR</text><text class="small" x="95" y="545">Approximate ambient lux</text><text class="small" x="95" y="568">AO → GPIO 34</text>
  <rect class="sensor" x="75" y="625" rx="12" width="235" height="80"/>
  <text class="label" x="95" y="658">PROJECTOR BUTTON</text><text class="small" x="95" y="685">GPIO 27 → GND</text>

  <!-- ESP32 -->
  <rect class="board" x="440" y="185" rx="25" width="300" height="490"/>
  <rect x="500" y="220" width="180" height="70" rx="8" fill="#b5cad9"/>
  <text x="535" y="263" fill="#07111f" font-family="Segoe UI" font-size="20" font-weight="700">ESP32 WROOM</text>
  <text class="label" x="513" y="330">ESP32 DevKit C V4</text>
  <text class="small" x="490" y="365">Local control policy</text>
  <text class="small" x="490" y="392">Occupancy hold + hysteresis</text>
  <text class="small" x="490" y="419">Runtime + estimated energy</text>
  <text class="small" x="490" y="446">Wi-Fi / MQTT telemetry</text>
  <line x1="475" y1="475" x2="705" y2="475" stroke="#36516d"/>
  <text class="small" x="490" y="510">GPIO 23  AC relay</text>
  <text class="small" x="490" y="540">GPIO 22  Fan relay</text>
  <text class="small" x="490" y="570">GPIO 21  Light relay</text>
  <text class="small" x="490" y="600">GPIO 19  Projector relay</text>
  <text class="small" x="490" y="640">3V3 / 5V / common GND</text>

  <!-- sensor data wires -->
  <path class="wire-data" marker-end="url(#arrow)" d="M310 258 H390 V260 H440"/>
  <path class="wire-data" marker-end="url(#arrow)" d="M310 398 H385 V345 H440"/>
  <path class="wire-data" marker-end="url(#arrow)" d="M310 538 H400 V430 H440"/>
  <path class="wire-data" marker-end="url(#arrow)" d="M310 665 H410 V615 H440"/>

  <!-- Relays -->
  <rect class="panel" x="835" y="130" rx="18" width="510" height="610"/>
  <text class="label" x="860" y="170">RELAY &amp; VISUAL LOAD LAYER</text>
  <g transform="translate(865 205)">
    <rect class="relay" rx="12" width="190" height="95"/><text class="label" x="20" y="35">RELAY 1</text><text class="small" x="20" y="62">AC · GPIO 23</text><text class="small" x="20" y="82">5V active-high</text>
    <path class="wire-load" d="M190 48 H255"/><rect class="load" x="255" rx="12" width="190" height="95"/><circle cx="290" cy="47" r="17" fill="#4fa8ff"/><text class="label" x="320" y="43">AC</text><text class="small" x="320" y="68">Blue indicator</text>
  </g>
  <g transform="translate(865 335)">
    <rect class="relay" rx="12" width="190" height="95"/><text class="label" x="20" y="35">RELAY 2</text><text class="small" x="20" y="62">Fan · GPIO 22</text><text class="small" x="20" y="82">5V active-high</text>
    <path class="wire-load" d="M190 48 H255"/><rect class="load" x="255" rx="12" width="190" height="95"/><circle cx="290" cy="47" r="17" fill="#59dc87"/><text class="label" x="320" y="43">FAN</text><text class="small" x="320" y="68">Green indicator</text>
  </g>
  <g transform="translate(865 465)">
    <rect class="relay" rx="12" width="190" height="95"/><text class="label" x="20" y="35">RELAY 3</text><text class="small" x="20" y="62">Light · GPIO 21</text><text class="small" x="20" y="82">5V active-high</text>
    <path class="wire-load" d="M190 48 H255"/><rect class="load" x="255" rx="12" width="190" height="95"/><circle cx="290" cy="47" r="17" fill="#ffd95c"/><text class="label" x="320" y="43">LIGHTS</text><text class="small" x="320" y="68">Yellow indicator</text>
  </g>
  <g transform="translate(865 595)">
    <rect class="relay" rx="12" width="190" height="95"/><text class="label" x="20" y="35">RELAY 4</text><text class="small" x="20" y="62">Projector · GPIO 19</text><text class="small" x="20" y="82">Cool-down protected</text>
    <path class="wire-load" d="M190 48 H255"/><rect class="load" x="255" rx="12" width="190" height="95"/><circle cx="290" cy="47" r="17" fill="#ff6767"/><text class="label" x="320" y="43">PROJECTOR</text><text class="small" x="320" y="68">Red indicator</text>
  </g>

  <!-- relay control bus -->
  <path class="wire-data" d="M740 510 H790 V253 H865"/><circle class="dot" cx="790" cy="510" r="6"/>
  <path class="wire-data" d="M740 540 H805 V383 H865"/><circle class="dot" cx="805" cy="540" r="6"/>
  <path class="wire-data" d="M740 570 H820 V513 H865"/><circle class="dot" cx="820" cy="570" r="6"/>
  <path class="wire-data" d="M740 600 H835 V643 H865"/><circle class="dot" cx="835" cy="600" r="6"/>

  <!-- power rails / legend -->
  <rect class="legend" x="45" y="780" rx="14" width="1300" height="75"/>
  <line class="wire-data" x1="80" y1="815" x2="135" y2="815"/><text class="small" x="150" y="820">Signal/control</text>
  <line class="wire-power" x1="325" y1="815" x2="380" y2="815"/><text class="small" x="395" y="820">3.3 V / 5 V power</text>
  <line class="wire-ground" x1="600" y1="815" x2="655" y2="815"/><text class="small" x="670" y="820">Common ground</text>
  <line class="wire-load" x1="850" y1="815" x2="905" y2="815"/><text class="small" x="920" y="820">Relay contact to LED + 220 Ω</text>
</svg>
